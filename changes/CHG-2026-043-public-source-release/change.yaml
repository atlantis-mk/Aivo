security_impact: "The Public repository exposes the selected source snapshot and replaces repository-scoped security configuration. Release publication uses repository secrets without printing them, refuses conflicting immutable R2 objects, and restores GitHub secret scanning, push protection, and private vulnerability reporting."
migration: "The private atlantis-mk/Aivo repository is backed up outside the workspace, deleted, and recreated at the same URL as a Public repository with a new identity and a new root main history. Existing GitHub refs, Actions history, and repository-scoped settings are not migrated. Tagged releases publish immutable assets to an Aivo R2 prefix and GitHub Releases."
