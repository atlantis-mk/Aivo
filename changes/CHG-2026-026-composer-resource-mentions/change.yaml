security_impact: "The renderer submits bounded typed resource IDs, but Core revalidates every ID against the current enabled catalog, immutable project contract, and global tool policy before persisting the user event or preparing Provider context. The combined local chooser accepts no renderer-authored path. Drag paths are derived by preload from actual dropped File objects, never accepted as renderer-authored strings, and revalidated by Electron main. Electron main reads only exact regular files within the attachment limit or returns selected directories for the existing project flow. Mentions cannot install, trust, globally enable, authorize, execute, or disclose credentials."
