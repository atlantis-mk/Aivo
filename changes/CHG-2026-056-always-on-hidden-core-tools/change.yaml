id: "CHG-2026-056-always-on-hidden-core-tools"
title: "Keep core tools always enabled and out of selectors"
type: "security"
status: "Done"
spec_revision: "0.1.4-active"
target_release: null
goal: "Replace the unfinished session/global core-tool toggle behavior with one durable Host rule: read, bash, edit, and write remain mandatory coding primitives, are absent from management and activation surfaces, and cannot be disabled through persisted preferences or public desktop RPC calls."
