boundaries:
  - "Hide read, bash, edit, and write from global tool settings, per-conversation activation, and composer resource selection while leaving optional tools independently manageable."
  - "Reject global disable requests for the four required primitives, ignore legacy global disabled rows, and make session active-tool updates preserve all four primitives."
  - "Ignore legacy disabledCoreTools metadata during request and Tool Snapshot assembly without changing tool permission prompts, workspace validation, execution authority, or Provider capability compatibility."
risks:
  - "A presentation-only filter would leave older clients or direct RPC callers able to disable a required primitive."
  - "Persisted legacy preferences could continue suppressing a primitive after the switches disappear."
  - "Over-broad filtering could hide optional built-ins or erase historical tool-call visibility."
