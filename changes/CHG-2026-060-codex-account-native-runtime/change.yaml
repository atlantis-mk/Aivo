related_changes:
  - "CHG-2026-055-codex-declared-runtime-capabilities"
boundaries:
  - "Codex account-native capabilities are owned separately from model-catalog declarations and are recomputed for every selected provider route."
  - "Only the built-in OpenAI Responses route authenticated through ChatGPT Codex OAuth may consume Codex-hosted image generation and Codex-account usage."
  - "OpenAI API-key image generation remains a distinct provider integration and is not inferred from Codex account authentication."
  - "Bundled system skills are versioned, read-only Host assets; their instructions never expand tool authority and tool-dependent skills are hidden outside eligible routes."
  - "Generated image responses are bounded, decoded into local artifacts, and never logged or persisted as raw base64 provider payloads."
risks:
  - "ChatGPT Codex hosted image endpoints and account capability contracts can change independently of the public model catalog."
  - "Large or malformed image payloads can exhaust memory or leak sensitive prompt and image contents if logging and retention are not bounded."
  - "Bundled upstream skill content can drift or introduce licensing and dependency changes that require review before updating."
  - "Provider fallback can leak account-only capabilities unless the effective tool and skill set is rebuilt for every route attempt."
next:
  - "Add an explicit Codex account capability manifest and route-scoped activation policy."
  - "Implement bounded Codex image generation and edit execution with OAuth account headers."
  - "Bundle and automatically synchronize supported Codex system skills without user import steps."
  - "Preserve namespace identities in model tool calls and add route-isolation, payload-limit, and skill-availability tests."
