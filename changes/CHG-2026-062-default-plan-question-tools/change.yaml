boundaries:
  - "Only update_plan and ask_user join the always-on Host core set; other Agent and automation tools remain dynamically contributed."
  - "Both controls are invoked only through structured tool calls; prompt text and keywords never trigger Host state changes."
  - "The two controls are reserved, non-toggleable, snapshot-bound Host identities and cannot be replaced by extensions or Providers."
risks:
  - "Making ask_user universally visible could stall unattended runs unless cancellation and interaction ownership remain deterministic."
  - "Making update_plan universally visible could encourage unnecessary calls unless its description remains explicit about use thresholds."
next:
  - "Register update_plan and ask_user directly after the default execution primitives."
  - "Extend reserved/core visibility, ordering, session activation, and global eligibility rules to both controls."
  - "Update prompts, specifications, and tests for the six-tool default contract."
