boundaries:
  - "The local image viewer is a dormant Provider-account tool: it is visible and executable only for the built-in OpenAI Responses route authenticated through ChatGPT Codex OAuth."
  - "The tool reads only a regular, non-sensitive image file resolved beneath the active workspace root, applies existing byte/pixel/model-payload bounds, and returns an ephemeral model image attachment."
  - "API-key, fallback, and every non-Codex Provider route must omit the tool and reject direct execution."
risks:
  - "A route-resolution or fallback regression could expose workspace image bytes to an ineligible Provider."
  - "Malformed, oversized, symlinked, or non-image files could bypass bounded image preparation without strict path and decode validation."
next:
  - "Register and route-gate the canonical view_image tool, then cover route isolation and file-validation behavior."
