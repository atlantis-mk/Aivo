name: Publish tagged release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
      - "!v*\\+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<SemVer> tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aivo-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            host_platform: darwin
            host_arch: arm64
            package_script: package:mac
          - runner: macos-15-intel
            platform: darwin-x86_64
            host_platform: darwin
            host_arch: x64
            package_script: package:mac
          - runner: windows-2025
            platform: windows-x86_64
            host_platform: win32
            host_arch: x64
            package_script: package:win
          - runner: ubuntu-24.04
            platform: linux-x86_64
            host_platform: linux
            host_arch: x64
            package_script: package:linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Bind requested release identity
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/release-publication.mjs validate-stable \
            --root "$GITHUB_WORKSPACE" \
            --version "$version" \
            --tag "$RELEASE_TAG"
      - name: Verify native runner architecture
        env:
          EXPECTED_HOST_PLATFORM: ${{ matrix.host_platform }}
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          node --input-type=module -e '
            const { EXPECTED_HOST_PLATFORM: platform, EXPECTED_HOST_ARCH: arch } = process.env;
            if (process.platform !== platform || process.arch !== arch) {
              throw new Error(`Expected ${platform}/${arch}, received ${process.platform}/${process.arch}.`);
            }
          '
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify desktop source
        run: |
          pnpm --filter @aivo/electron lint
          pnpm --filter @aivo/electron test
      - name: Package desktop on the native target
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @aivo/electron ${{ matrix.package_script }}
      - name: Normalize release artifacts
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/release-publication.mjs collect \
            --input "$GITHUB_WORKSPACE/build/desktop" \
            --output "$RUNNER_TEMP/aivo-release" \
            --platform "${{ matrix.platform }}" \
            --version "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: aivo-release-${{ matrix.platform }}
          path: ${{ runner.temp }}/aivo-release
          if-no-files-found: error
          retention-days: 14

  publish_r2:
    name: Publish immutable R2 assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful native builds
        run: test "${{ needs.build.result }}" = success
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: aivo-release-*
          path: ${{ runner.temp }}/aivo-release
          merge-multiple: true
      - name: Validate R2 configuration and create publication plan
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"
          : "${R2_ACCOUNT_ID:?Missing R2_ACCOUNT_ID variable}"
          : "${R2_BUCKET:?Missing R2_BUCKET variable}"
          : "${R2_PUBLIC_BASE_URL:?Missing R2_PUBLIC_BASE_URL variable}"
          prefix="${R2_PREFIX:-aivo}"
          version="${RELEASE_TAG#v}"
          published_at="$(git show -s --format=%cI "$RELEASE_TAG^{commit}")"
          node scripts/release-publication.mjs plan \
            --input "$RUNNER_TEMP/aivo-release" \
            --output "$RUNNER_TEMP/aivo-publication" \
            --version "$version" \
            --base-url "$R2_PUBLIC_BASE_URL" \
            --prefix "$prefix" \
            --published-at "$published_at"
      - name: Install isolated R2 upload client
        run: |
          python3 -m venv "$RUNNER_TEMP/aivo-awscli"
          "$RUNNER_TEMP/aivo-awscli/bin/pip" install --disable-pip-version-check --quiet awscli==1.44.87
          echo "$RUNNER_TEMP/aivo-awscli/bin" >> "$GITHUB_PATH"
      - name: Publish immutable version objects
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS=$'\t' read -r source key content_type sha256; do
            [[ -n "$source" && -n "$key" && -n "$content_type" && -n "$sha256" ]]
            existing_sha256="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$key" --query 'Metadata.sha256' --output text 2>/dev/null || true)"
            if [[ "$existing_sha256" == "None" ]]; then
              echo "Refusing to overwrite an object without digest metadata: $key" >&2
              exit 1
            elif [[ -n "$existing_sha256" ]]; then
              [[ "$existing_sha256" == "$sha256" ]] || { echo "Refusing to overwrite immutable object: $key" >&2; exit 1; }
              echo "Immutable object already matches; skipping: $key"
              continue
            fi
            aws s3 cp "$source" "s3://${R2_BUCKET}/${key}" --endpoint-url "$endpoint" --content-type "$content_type" --cache-control "public, max-age=31536000, immutable" --metadata "sha256=$sha256" --no-progress
          done < "$RUNNER_TEMP/aivo-publication/immutable.tsv"
      - name: Publish stable manifest last and verify R2 readback
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${R2_PREFIX:-aivo}"
          manifest_key="${prefix}/channels/stable/latest.json"
          source="$RUNNER_TEMP/aivo-publication/latest.json"
          aws s3 cp "$source" "s3://${R2_BUCKET}/${manifest_key}" --endpoint-url "$endpoint" --content-type application/json --cache-control "no-store, max-age=0" --no-progress
          aws s3 cp "s3://${R2_BUCKET}/${manifest_key}" "$RUNNER_TEMP/published-latest.json" --endpoint-url "$endpoint" --no-progress
          cmp "$source" "$RUNNER_TEMP/published-latest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: aivo-release-publication
          path: |
            ${{ runner.temp }}/aivo-publication/SHA256SUMS
            ${{ runner.temp }}/aivo-publication/latest.json
          if-no-files-found: error
          retention-days: 14

  github_release:
    name: Publish GitHub Release assets
    needs: [build, publish_r2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require completed build and R2 publication
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.publish_r2.result }}" = success
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: aivo-release-*
          path: ${{ runner.temp }}/aivo-github-release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: aivo-release-publication
          path: ${{ runner.temp }}/aivo-publication
      - name: Create or resume the verified release
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          notes="releases/${tag}.md"
          asset_directory="$RUNNER_TEMP/aivo-github-release"
          mapfile -t assets < <(find "$asset_directory" -maxdepth 1 -type f -name 'Aivo_*' -print | sort)
          [[ "${#assets[@]}" == 6 ]]
          cp "$RUNNER_TEMP/aivo-publication/SHA256SUMS" "$asset_directory/SHA256SUMS"
          mapfile -t release_titles < <(sed -n 's/^# \(.*[^[:space:]]\)[[:space:]]*$/\1/p' "$notes")
          [[ "${#release_titles[@]}" == 1 ]]
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "${assets[@]}" "$asset_directory/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${release_titles[0]}" --notes-file "$notes" --draft
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "${release_titles[0]}" --notes-file "$notes" --draft=false
          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json draft,assets)"
          [[ "$(jq '[.assets[] | select(.name == "SHA256SUMS" or (.name | startswith("Aivo_")))] | length' <<< "$release_json")" == 7 ]]
          jq -e '.draft == false' <<< "$release_json" >/dev/null
